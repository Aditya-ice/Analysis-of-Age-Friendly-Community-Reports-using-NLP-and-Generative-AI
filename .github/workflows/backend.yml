name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "infra/free-pilot/roles.sql"
      - "data/reports.yaml"
      - "evaluations/**"
      - "contracts/**"
      - "web-tests/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "openapi.json"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: elderhelp_test
          POSTGRES_USER: elderhelp
          POSTGRES_PASSWORD: elderhelp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elderhelp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELDERHELP_DATABASE_URL: postgresql+asyncpg://elderhelp:elderhelp@localhost:5432/elderhelp_test
      ELDERHELP_TEST_DATABASE_URL: postgresql+asyncpg://elderhelp:elderhelp@localhost:5432/elderhelp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: uv sync --frozen --group dev --extra ingestion
      - run: uv run --no-sync ruff check backend evaluations/v2
      - run: node --test web-tests/*.test.mjs
      - run: python3 tools/sync_contract_fixtures.py && git diff --exit-code -- ios/ElderHelpTests/Fixtures android/app/src/test/resources/contracts
      - run: uv run --no-sync python tools/download_reranker.py
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync pytest --cov=elderhelp --cov-report=term-missing
      - run: uv run --no-sync python -m elderhelp.openapi
      - run: git diff --exit-code -- openapi.json
      - run: docker build -t elderhelp-api:test .
      - name: Measure isolated Linux serving image memory
        run: |
          docker run --rm --network none --memory 512m --memory-swap 512m --cpus 0.1 \
            -v "$PWD/tools/serving_memory_smoke.py:/tmp/serving_memory_smoke.py:ro" \
            --entrypoint python elderhelp-api:test /tmp/serving_memory_smoke.py \
            | tee serving-memory.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-serving-memory
          path: serving-memory.json
