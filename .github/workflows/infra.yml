name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/workflows/deploy-staging.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
      - name: Check formatting
        run: tofu -chdir=infra/terraform fmt -check -recursive
      - name: Initialize providers
        run: tofu -chdir=infra/terraform init -backend=false
      - name: Validate configuration
        run: tofu -chdir=infra/terraform validate
