name: Android
on:
  pull_request:
    paths: ['android/**', 'openapi.json', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify generated contract
        run: |
          python3 android/tools/generate_models.py
          git diff --exit-code -- android/app/src/main/java/com/adityaice/elderhelp/Models.kt
      - name: Build and test
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/debug/*.apk
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 ios/MockServer/server.py > /tmp/mock.log 2>&1 & ./android/gradlew -p android connectedDebugAndroidTest -PelderhelpApiUrl=http://10.0.2.2:8765/ --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results
          path: android/app/build/reports/androidTests
