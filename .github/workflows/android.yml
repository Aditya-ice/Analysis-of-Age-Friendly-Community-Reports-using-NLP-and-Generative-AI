name: Android
on:
  pull_request:
    paths: ['android/**', 'openapi.json', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify generated contract
        run: |
          python3 android/tools/generate_models.py
          git diff --exit-code -- android/app/src/main/java/com/adityaice/elderhelp/Models.kt
      - name: Build and test
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/debug/*.apk
