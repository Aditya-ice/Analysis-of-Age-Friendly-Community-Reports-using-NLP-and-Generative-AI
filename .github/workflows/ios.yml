name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "contracts/**"
      - "tools/pilot_mock.py"
      - "openapi.json"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify shared fixtures
        run: |
          python3 tools/sync_contract_fixtures.py
          git diff --exit-code -- ios/ElderHelpTests/Fixtures
      - name: Regenerate project
        working-directory: ios
        run: xcodegen generate
      - name: Verify generated project is current
        run: git diff --exit-code -- ios/ElderHelp.xcodeproj
      - name: Test portable API core
        run: swift test --package-path ios
      - name: Test iOS application in simulator
        run: |
          python3 ios/MockServer/server.py > "${RUNNER_TEMP}/elderhelp-mock.log" 2>&1 &
          MOCK_PID=$!
          cleanup() {
            STATUS=$?
            cat "${RUNNER_TEMP}/elderhelp-mock.log"
            kill "${MOCK_PID}" 2>/dev/null || true
            exit "${STATUS}"
          }
          trap cleanup EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/healthz > /dev/null; then
              break
            fi
            if [[ "${attempt}" == "20" ]]; then
              cat "${RUNNER_TEMP}/elderhelp-mock.log"
              exit 1
            fi
            sleep 0.25
          done
          xcode-select -p
          xcodebuild -version
          xcodebuild \
            -project ios/ElderHelp.xcodeproj \
            -scheme ElderHelp \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath "${RUNNER_TEMP}/ElderHelp.xcresult" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: ${{ runner.temp }}/ElderHelp.xcresult
