name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "openapi.json"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Regenerate project
        working-directory: ios
        run: xcodegen generate
      - name: Verify generated project is current
        run: git diff --exit-code -- ios/ElderHelp.xcodeproj
      - name: Test portable API core
        run: swift test --package-path ios
      - name: Start mock API
        run: python3 ios/MockServer/server.py &
      - name: Test iOS application in simulator
        run: >-
          xcodebuild
          -project ios/ElderHelp.xcodeproj
          -scheme ElderHelp
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO
          test
