name: ElderHelp
options:
  bundleIdPrefix: com.adityaice
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  ElderHelp:
    type: application
    platform: iOS
    sources:
      - ElderHelp
    info:
      path: ElderHelp/Info.plist
      properties:
        CFBundleDisplayName: ElderHelp
        API_BASE_URL: http://127.0.0.1:8000
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adityaice.ElderHelp
        PRODUCT_NAME: ElderHelp
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
    scheme:
      testTargets:
        - ElderHelpTests
        - ElderHelpUITests
  ElderHelpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ElderHelpTests
    dependencies:
      - target: ElderHelp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adityaice.ElderHelpTests
        GENERATE_INFOPLIST_FILE: YES
  ElderHelpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ElderHelpUITests
    dependencies:
      - target: ElderHelp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adityaice.ElderHelpUITests
        GENERATE_INFOPLIST_FILE: YES
