services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: elderhelp
      POSTGRES_USER: elderhelp
      POSTGRES_PASSWORD: elderhelp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elderhelp"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - elderhelp-postgres:/var/lib/postgresql/data

volumes:
  elderhelp-postgres:
